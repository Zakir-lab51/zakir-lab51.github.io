<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script src="../assets/gate.js"></script><!-- ZAKIR_GATE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!-- home-screen app -->
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Zakir Lab"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>PDF — Zakir Lab</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #111111;
    --paper: #ffffff;
    --panel: #ececec;
    --yellow: #ffd21f;
    --muted: #555555;
  }

  body {
    min-height: 100vh;
    background: var(--panel);
    color: var(--ink);
    font-family: 'Poppins', system-ui, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── top bar: back, title, open original ── */
  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
  }
  .bar a {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 36px;
    padding: 0 12px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
  }
  .bar a[hidden] { display: none; }
  .bar .back { background: var(--yellow); }
  .bar h1 {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── pages ── */
  .pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 12px max(8px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  .page {
    width: min(100%, 900px);
    aspect-ratio: 1 / 1.414;
    background: var(--paper);
    box-shadow: 0 1px 3px rgba(17, 17, 17, 0.18);
  }
  .page canvas { display: block; width: 100%; height: 100%; }

  /* ── loading / error message ── */
  .status {
    margin: 64px auto 0;
    max-width: 320px;
    text-align: center;
    color: var(--muted);
    line-height: 1.6;
  }
  .status strong {
    display: block;
    margin-bottom: 6px;
    font-family: 'Archivo Black', 'Poppins', sans-serif;
    font-weight: 400;
    font-size: 20px;
    color: var(--ink);
  }
  .status a { color: var(--ink); font-weight: 600; }
  .status[hidden] { display: none; }

  /* ── page counter ── */
  .counter {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    transition: opacity .3s;
  }
  .counter[hidden] { display: none; }
  .counter.idle { opacity: 0; }
</style>
</head>
<body>
<header class="bar">
  <a class="back" id="back" href="/">&lsaquo; Back</a>
  <h1 id="title">PDF</h1>
  <a class="open" id="open" href="#" target="_blank" rel="noopener" hidden>Open &#8599;</a>
</header>
<main class="pages" id="pages"></main>
<p class="status" id="status">Loading PDF&hellip;</p>
<div class="counter" id="counter" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* Zakir Lab — in-app PDF viewer.
   The home-screen app sends PDF links here (see assets/pdf-in-app.js) so a
   PDF opens inside the app with a back button, instead of in Safari's sheet.
   /viewer/?src=<pdf url>&title=<name> */
(function () {
  // PDFs only come from this site or the notes uploaded through /admin/
  var ALLOWED_ORIGINS = [location.origin, 'https://sxnkgfxodpnxpxrhyqzx.supabase.co'];
  var KEEP_AROUND = 6;          // rendered pages kept either side of the one in view
  var MAX_PIXEL_RATIO = 2;      // sharper than 1x, without blowing phone memory

  var params = new URLSearchParams(location.search);
  var titleEl = document.getElementById('title');
  var statusEl = document.getElementById('status');
  var pagesEl = document.getElementById('pages');
  var counterEl = document.getElementById('counter');
  var openEl = document.getElementById('open');
  var backEl = document.getElementById('back');

  var title = (params.get('title') || 'PDF').slice(0, 160);
  titleEl.textContent = title;
  document.title = title + ' — Zakir Lab';

  // back to the page the PDF was opened from; straight to home if there isn't one
  backEl.addEventListener('click', function (e) {
    var cameFromHere = false;
    try { cameFromHere = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (err) {}
    if (cameFromHere && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });

  function fail(message) {
    pagesEl.innerHTML = '';
    counterEl.hidden = true;
    statusEl.hidden = false;
    statusEl.innerHTML = '<strong>Couldn’t open this PDF</strong>';
    statusEl.appendChild(document.createTextNode(message + ' '));
    if (!openEl.hidden) {
      var link = document.createElement('a');
      link.href = openEl.href;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Open it directly';
      statusEl.appendChild(link);
    }
  }

  var src;
  try { src = new URL(params.get('src') || '', location.href); } catch (err) { src = null; }
  if (!src || !/^https?:$/.test(src.protocol) || ALLOWED_ORIGINS.indexOf(src.origin) === -1) {
    fail('The link to it isn’t valid.');
    return;
  }
  openEl.href = src.href;
  openEl.hidden = false;

  if (!window.pdfjsLib) {
    fail('The PDF reader didn’t load. Check your connection.');
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var pdf = null;
  var slots = [];               // one .page div per PDF page
  var rendered = new Set();
  var current = 1;

  var task = pdfjsLib.getDocument({ url: src.href });
  task.onProgress = function (p) {
    if (p.total) statusEl.textContent = 'Loading PDF… ' + Math.min(99, Math.round(p.loaded * 100 / p.total)) + '%';
  };

  task.promise.then(function (doc) {
    pdf = doc;
    return pdf.getPage(1);
  }).then(function (first) {
    var size = first.getViewport({ scale: 1 });
    for (var i = 1; i <= pdf.numPages; i++) {
      var slot = document.createElement('div');
      slot.className = 'page';
      slot.dataset.page = i;
      slot.style.aspectRatio = size.width + ' / ' + size.height;
      pagesEl.appendChild(slot);
      slots.push(slot);
      nearby.observe(slot);
    }
    statusEl.hidden = true;
    counterEl.hidden = false;
    updateCounter();
  }).catch(function (err) {
    console.warn('[viewer]', err);
    fail(err && err.name === 'MissingPDFException' ? 'It isn’t there any more.' : 'It may be too large or offline.');
  });

  // render pages as they come near the screen
  var nearby = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) render(entry.target);
    });
  }, { rootMargin: '150% 0px' });

  function render(slot) {
    if (slot.dataset.state) return;
    slot.dataset.state = 'rendering';
    var number = Number(slot.dataset.page);
    var width = slot.clientWidth;
    pdf.getPage(number).then(function (page) {
      var base = page.getViewport({ scale: 1 });
      slot.style.aspectRatio = base.width + ' / ' + base.height;
      var ratio = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);
      var viewport = page.getViewport({ scale: (width / base.width) * ratio });
      var canvas = document.createElement('canvas');
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function () {
        if (slot.dataset.state !== 'rendering') return;   // released while drawing
        slot.replaceChildren(canvas);
        slot.dataset.state = 'done';
        rendered.add(slot);
        release();
      });
    }).catch(function (err) {
      console.warn('[viewer] page ' + number, err);
      slot.dataset.state = '';
    });
  }

  // free canvases far from the current page so long PDFs don't run a phone out of memory
  function release() {
    rendered.forEach(function (slot) {
      if (Math.abs(Number(slot.dataset.page) - current) > KEEP_AROUND) clear(slot);
    });
  }

  function clear(slot) {
    var canvas = slot.querySelector('canvas');
    if (canvas) { canvas.width = 0; canvas.height = 0; }
    slot.replaceChildren();
    slot.dataset.state = '';
    rendered.delete(slot);
  }

  // "3 / 24" pill, fades out when scrolling stops
  var idleTimer;
  function updateCounter() {
    if (!slots.length) return;
    var middle = window.innerHeight / 2;
    for (var i = 0; i < slots.length; i++) {
      var box = slots[i].getBoundingClientRect();
      if (box.bottom >= middle) { current = i + 1; break; }
    }
    counterEl.textContent = current + ' / ' + slots.length;
    counterEl.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { counterEl.classList.add('idle'); }, 1500);
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; updateCounter(); });
  }, { passive: true });

  // turning the phone changes the page width: redraw at the new size
  var lastWidth = window.innerWidth;
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (window.innerWidth === lastWidth || !pdf) return;
      lastWidth = window.innerWidth;
      Array.from(rendered).forEach(clear);
      slots.forEach(function (slot) { nearby.unobserve(slot); nearby.observe(slot); });
    }, 250);
  });
})();
</script>
</body>
</html>
